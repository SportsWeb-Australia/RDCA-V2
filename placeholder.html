<!DOCTYPE html>
<!-- RDCA reusable "intentionally blank" page for content not yet supplied.
       /placeholder.html?title=Rep%20Team%20U16%20Boys&status=tbs
     ?title  = heading shown.
     ?status = (optional) "tbs" shows the "representative team not yet selected"
               message. Omit for the generic "awaiting content" state.
     Never links out to the old rdca.com site (it disappears at cutover). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RDCA</title>
<meta name="description" content="Ringwood &amp; District Cricket Association — community cricket across Melbourne&#x27;s outer east and the Yarra Valley.">
<link rel="canonical" href="https://rdca.com/placeholder">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RDCA">
<meta property="og:title" content="RDCA">
<meta property="og:description" content="Ringwood &amp; District Cricket Association — community cricket across Melbourne&#x27;s outer east and the Yarra Valley.">
<meta property="og:url" content="https://rdca.com/placeholder">
<meta property="og:image" content="https://rdca.com/icon-512.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="/_shared.css">
<link rel="stylesheet" href="/_pages.css">
<script src="/rdca-components.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d1f3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="/pwa.js" defer></script>
</head>
<body data-page="">

<div data-rdca="masthead"></div>

<header class="page-hero">
  <div class="page-hero-inner">
    <div class="crumb"><a href="/index.html">Home</a> <i class="ti ti-chevron-right"></i> <span id="crumb-title">Page</span></div>
    <div class="eyebrow">RDCA</div>
    <h1 id="hero-title">Page</h1>
  </div>
</header>

<main id="main" tabindex="-1">
<div class="page-wrap">
  <div class="empty-state">
    <div class="empty-ic"><i class="ti ti-file-pencil"></i></div>
    <h2>This page is intentionally blank</h2>
    <p>It mirrors the current RDCA website, which doesn't have content here yet.</p>
    <div class="empty-actions" id="src-action"></div>
    <div class="empty-note"><strong>SportsWeb:</strong> awaiting content direction from RDCA for this page — let us know what you'd like here and we'll add it.</div>
  </div>
</div>

</main>
<div data-rdca="sponsor-carousel"></div>
<div data-rdca="footer"></div>

<script>
  (function(){
    var q = new URLSearchParams(location.search);
    var title = q.get("title") || "Page";
    var status = q.get("status") || "";
    document.getElementById("hero-title").textContent = title;
    document.getElementById("crumb-title").textContent = title;
    document.title = title + " — RDCA";
    // "tbs" = representative team not yet selected. Shown in-site; never links out
    // to the old rdca.com (which disappears at cutover).
    if (status === "tbs") {
      var es = document.querySelector(".empty-state");
      if (es) {
        es.innerHTML =
          '<div class="empty-ic"><i class="ti ti-users"></i></div>' +
          '<h2>' + title + ' &mdash; not yet selected</h2>' +
          '<p>Representative teams for the coming season have not been announced yet. ' +
          'Selections will be published here once confirmed.</p>';
      }
    }
  })();
</script>
<script src="https://sportsweb-one-v1.vercel.app/sitepulse-widget.js"
        data-club-id="973aaf1c-dc2f-40f5-a17b-3f8c1e94ec60"
        data-source="onboarding"
        data-website-status="draft"></script>
</body>
</html>
