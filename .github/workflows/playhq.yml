name: Refresh PlayHQ data

# Pulls ladders/results/fixtures from the PlayHQ public API and commits
# data/playhq.json. The site reads that file and switches last->current season
# on its own at the cutover timestamp, so this job just keeps the data fresh.
# The API key is the PLAYHQ_API_KEY repository secret — never in the repo.

on:
  schedule:
    - cron: '7,37 * * * *'      # twice an hour
  workflow_dispatch: {}          # allow manual run

permissions:
  contents: write

concurrency:
  group: playhq-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch PlayHQ data
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
        run: node scripts/playhq-fetch.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/playhq.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/playhq.json
            git commit -m "chore: refresh PlayHQ data [skip ci]"
            git push
          else
            echo "No change."
          fi
